name: vigiroutes_terrain
description: VigiRoutes Terrain — Agent app for CT inspection centers
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  provider: ^6.1.2
  mobile_scanner: ^5.1.0
  permission_handler: ^11.3.1
  geolocator: ^13.0.4
  intl: ">=0.20.2 <0.21.0"
  cupertino_icons: ^1.0.6

  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  firebase_crashlytics: ^4.1.3
  flutter_local_notifications: ^18.0.1
  url_launcher: ^6.3.2

flutter:
  uses-material-design: true

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
